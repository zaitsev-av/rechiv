<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Транскрипт — Rechiv</title>
    <script src="../shared/theme-boot.js"></script>
    <link rel="stylesheet" href="../shared/theme.css">
    <link rel="stylesheet" href="transcript.css">
  </head>
  <body>
    <div class="page">
      <header class="transcript-header">
        <div class="header-nav">
          <nav class="page-nav" aria-label="Разделы Rechiv">
            <a href="history.html">Созвоны</a>
            <a href="settings.html">Настройки</a>
          </nav>
          <span class="local-badge">Данные не покидают компьютер</span>
        </div>

        <div class="meta">
          <p class="eyebrow">Транскрипт встречи</p>
          <h1 id="title">Загрузка…</h1>
          <p id="info">Получаю данные локальной сессии</p>
          <div id="live-indicator" class="live-indicator hidden" role="status">
            <span class="live-indicator-dot" aria-hidden="true"></span>
            <span id="live-indicator-text">Live-транскрипция</span>
          </div>
        </div>
      </header>

      <div id="banner" class="banner hidden" role="alert">
        <span id="banner-text"></span>
        <button id="banner-close" class="banner-close" type="button" aria-label="Закрыть">
          ×
        </button>
      </div>

      <div class="workspace">
        <div class="tabs" role="tablist" aria-label="Разделы встречи">
          <button class="tab active" data-tab="transcript" role="tab">
            <span class="tab-icon tab-icon-transcript" aria-hidden="true"></span>
            Транскрипт
          </button>
          <button
            class="tab disabled"
            data-tab="summary"
            id="tab-summary"
            role="tab"
            disabled
          >
            <span class="tab-icon tab-icon-summary" aria-hidden="true"></span>
            Саммари
          </button>
        </div>

        <div id="panel-transcript" class="tab-panel">
          <div class="filter-bar">
            <span class="filter-label">Показывать</span>
            <div id="filters" class="filters"></div>
          </div>
          <div id="segments" class="segments">
            <div class="transcript-loading">
              <span class="loading-spinner"></span>
              Транскрипт готовится
            </div>
          </div>
        </div>

        <div id="panel-summary" class="tab-panel hidden">
          <article id="summary-content" class="summary-content"></article>
        </div>

      </div>

      <button id="btn-top" class="scroll-top" type="button" title="Наверх" aria-label="Наверх">
        <span aria-hidden="true">↑</span>
      </button>

      <footer id="footer-transcript" class="action-dock hidden">
        <div class="action-dock-inner">
          <button id="btn-summary" class="btn btn-primary" disabled>Сделать саммари</button>
          <span class="action-divider"></span>
          <button id="btn-download" class="btn btn-secondary">Скачать JSON</button>
          <button id="btn-copy" class="btn btn-secondary">Копировать текст</button>
        </div>
      </footer>

      <footer id="footer-summary" class="action-dock hidden">
        <div class="action-dock-inner">
          <button id="btn-regenerate" class="btn btn-primary">Перегенерировать</button>
          <button id="btn-copy-summary" class="btn btn-secondary">Копировать саммари</button>
        </div>
      </footer>
    </div>
    <script src="transcript.js" type="module"></script>
  </body>
</html>
